[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xunji-training-monitor"
version = "0.8.0"
description = "A lightweight training monitor server for deep learning experiments."
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Zephyer" }
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30,<0.34",
    "requests>=2.32",
]

[project.optional-dependencies]
console = [
    "rich>=13.0",
]
pixel = [
    "pillow>=10.0",
]
desktop = [
    "pillow>=10.0",
]

[project.scripts]
training-monitor = "monitorctl_py:main"
training-monitor-watch = "auto_watch:main"
train_mot = "monitorctl_py:train_mot_main"

[tool.setuptools]
package-dir = {"" = "server"}
packages = ["alchemy_assets"]
py-modules = [
    "app",
    "auto_watch",
    "openmmlab_log",
    "training_monitor",
    "hardware",
    "console_ui",
    "desktop_ui",
    "pixel_window",
    "pixel_assets",
    "metric_series",
    "monitor_config",
    "direct_monitor",
    "discovery_agent",
    "run_aliases",
    "local_gateway",
    "cloudflare_tunnel",
    "monitorctl_py",
]

[tool.setuptools.package-data]
alchemy_assets = ["*.png"]
